name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: postgresql://postgres:Syk0215@db:5432/canteen_system
  REDIS_URL: redis://redis:6379/0

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          docker compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for services..."
          sleep 60

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.ci.yml exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Database ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Seed demo user
        run: |
          docker compose -f docker-compose.ci.yml exec -T db psql -U postgres -d canteen_system -c "
            INSERT INTO users (id, username, email, created_at, updated_at)
            VALUES (1, 'specialist', 'specialist@tis.local', NOW(), NOW())
            ON CONFLICT (id) DO NOTHING;
          " || true

      - name: Run full test suite
        run: |
          docker compose -f docker-compose.ci.yml exec -T backend pytest tests/ -v --tb=short --maxfail=3

      - name: Run Smoke Test Path A
        run: |
          docker compose -f docker-compose.ci.yml exec -T backend bash scripts/daily_smoke_test.sh --path-a

      - name: Clean up
        run: |
          docker compose -f docker-compose.ci.yml exec -T db psql -U postgres -d canteen_system -c "
            DELETE FROM approval_logs WHERE project_id IN (SELECT id FROM projects WHERE project_name LIKE 'smoke_test%');
            DELETE FROM projects WHERE project_name LIKE 'smoke_test%';
          " || true

      - name: Run Smoke Test Path B
        run: |
          docker compose -f docker-compose.ci.yml exec -T backend bash scripts/daily_smoke_test.sh --path-b

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true