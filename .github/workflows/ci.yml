name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: postgresql://postgres:Syk0215@db:5432/canteen_system
  REDIS_URL: redis://redis:6379/0

jobs:
  # ── Job 1: Full Test Suite ─────────────────────────────────────────
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: canteen_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Syk0215
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Seed demo user
        run: |
          PGPASSWORD=Syk0215 psql -h localhost -U postgres -d canteen_system -c "
            INSERT INTO users (id, username, email, created_at, updated_at)
            VALUES (1, 'specialist', 'specialist@tis.local', NOW(), NOW())
            ON CONFLICT (id) DO NOTHING;
          " || true

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short --maxfail=3
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          retention-days: 7

  # ── Job 2: Smoke Tests ────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker daemon
        run: |
          sudo service docker start
          docker info

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.ci.yml build

      - name: Start services (db + redis + minio + backend)
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 45

      - name: Wait for database to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.ci.yml exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Database ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Health check
        run: |
          curl -s http://localhost:8000/health || exit 1

      - name: Run Smoke Test Path A
        run: |
          bash scripts/daily_smoke_test.sh --path-a
        env:
          DATABASE_URL: postgresql://postgres:Syk0215@db:5432/canteen_system
          REDIS_URL: redis://redis:6379/0

      - name: Clean up projects from Path A
        run: |
          docker compose -f docker-compose.ci.yml exec -T db psql -U postgres -d canteen_system -c "
            DELETE FROM approval_logs WHERE project_id IN (SELECT id FROM projects WHERE project_name LIKE 'smoke_test%');
            DELETE FROM projects WHERE project_name LIKE 'smoke_test%';
          " || true

      - name: Run Smoke Test Path B
        run: |
          bash scripts/daily_smoke_test.sh --path-b
        env:
          DATABASE_URL: postgresql://postgres:Syk0215@db:5432/canteen_system
          REDIS_URL: redis://redis:6379/0

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true